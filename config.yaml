# ============================================================
#  AI 短视频生成器 配置文件
#  首次使用只需填入下方两个 API KEY,其余保持默认即可
# ============================================================

# OpenRouter API Key (https://openrouter.ai/settings/keys 获取)
# 通过 OpenRouter 可使用任意大模型撰写分镜脚本
openrouter_api_key: ""

# fal.ai API Key (https://fal.ai/dashboard/keys 获取)
fal_api_key: ""

# ---------------- LLM(编剧 + 导演,经 OpenRouter) ----------------
llm:
  # 撰写分镜脚本的模型,可换成 OpenRouter 上的任意模型,例如:
  #   anthropic/claude-fable-5      (默认,质量最佳)
  #   anthropic/claude-opus-5
  #   openai/gpt-5.2
  #   google/gemini-3-pro
  #   deepseek/deepseek-r2
  model: "anthropic/claude-fable-5"
  # 思考深度: low / medium / high / xhigh / max,留空则不传该参数
  # (不支持 reasoning 的模型会自动忽略)
  reasoning_effort: "high"
  # 单次请求最大 token(含思考过程,不宜过小)
  max_tokens: 32000

# ---------------- Kling 视频生成(fal.ai) ----------------
kling:
  # 文生视频端点:无固定主角的镜头组使用
  text_endpoint: "fal-ai/kling-video/v3/pro/text-to-video"
  # 角色元素生视频端点:有固定主角时使用,把主角参考图作为角色元素
  # (@Element1)带入每个镜头组,保证全片角色外观一致
  # (是否需要由导演模型自动判断,无需设置)
  reference_endpoint: "fal-ai/kling-video/o3/pro/reference-to-video"
  # 分镜时长回退值(秒),3~15。影片由若干"镜头组"构成,每组内含 1~6 个
  # 分镜、总长 3~15 秒,一组由 Kling 一次性连续生成(组内衔接由模型原生
  # 保证);各分镜时长由导演模型按叙事节奏决定,仅当模型未给出时使用此值
  clip_duration: 10
  # 默认画幅: 16:9(横屏)/ 9:16(竖屏)/ 1:1
  # 界面上选择的横屏/竖屏优先于此处;此处仅作为界面默认值与命令行模式的画幅
  aspect_ratio: "16:9"
  # Kling 3 原生音效(环境声)。关闭可节省约 1/3 视频费用
  generate_audio: true
  # 生成失败时单个镜头的重试次数
  max_retries: 2
  # 同时生成的镜头数(并行提交,显著缩短总耗时)
  concurrency: 3
  # 单个镜头的生成超时(秒),超时按失败重试
  shot_timeout: 1500
  # 视频生成单价(美元/秒),用于生成前的费用预估(仅展示,不影响生成)。
  # 默认对应 Kling v3 pro 开启原生音效的价格;若 generate_audio: false
  # 约为 0.112;更换端点后请同步调整;设为 0 则不显示费用预估
  price_per_second: 0.168

# ---------------- 主角参考图(fal.ai) ----------------
image:
  # 生成主角参考图的文生图模型
  endpoint: "fal-ai/nano-banana-2"

# ---------------- 旁白解说(Edge TTS,免费) ----------------
narration:
  # 是否允许旁白解说。开启后由导演模型判断影片是否需要解说:
  # 科普/广告/故事旁白等题材自动配旁白+字幕,氛围片/MV 则保持无旁白
  enabled: true
  # 旁白音色(微软 Edge TTS,免费,需联网)。常用中文音色:
  #   zh-CN-XiaoxiaoNeural(女声,默认) zh-CN-YunxiNeural(男声)
  #   zh-CN-YunyangNeural(新闻男声)   zh-CN-XiaoyiNeural(女声,活泼)
  voice: "zh-CN-XiaoxiaoNeural"
  # 旁白音量(0~2,1 为原始音量)
  volume: 1.0
  # 是否为旁白生成字幕(优先烧录进画面,失败自动改为 mp4 软字幕)。
  # 界面上勾选的「旁白字幕」优先于此处;此处仅作为界面默认值与命令行模式的开关
  subtitles: true

# ---------------- 成片 ----------------
video:
  # 目标总时长(秒)。导演模型自行决定镜头数量与每镜头时长,
  # 并把总时长控制在目标值 ±15% 以内
  target_duration: 60
  # 输出目录(相对程序目录)
  output_dir: "output"
  # 镜头间交叉溶解转场时长(秒),0 为硬切
  transition: 0.5
  # 背景音乐音量(0~1)。把 mp3 等音频文件放进程序目录的 music/
  # 文件夹即可自动混入背景音乐(由导演模型按影片情绪挑选);
  # 文件夹为空则不加背景音乐。
  bgm_volume: 0.22

# ---------------- ffmpeg ----------------
ffmpeg:
  # ffmpeg 可执行文件路径。打包版(exe)已内置 ffmpeg,无需设置;
  # 源码运行时,已加入 PATH 保持 "ffmpeg" 即可,
  # 否则填绝对路径,例如 C:\\tools\\ffmpeg\\bin\\ffmpeg.exe
  # (拼接转场需要同目录下的 ffprobe,标准 ffmpeg 发行包均自带)
  path: "ffmpeg"
