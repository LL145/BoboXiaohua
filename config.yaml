# ============================================================
#  AI 短视频生成器 配置文件
#  首次使用请填入下方的 API KEY
# ============================================================

# OpenRouter API Key (https://openrouter.ai/settings/keys 获取)
# 通过 OpenRouter 可使用任意大模型撰写分镜脚本
openrouter_api_key: ""

# fal.ai API Key (https://fal.ai/dashboard/keys 获取)
fal_api_key: ""

# ---------------- LLM(编剧 + 导演,经 OpenRouter) ----------------
llm:
  # 撰写分镜脚本的模型,可换成 OpenRouter 上的任意模型,例如:
  #   anthropic/claude-fable-5      (默认,质量最佳)
  #   anthropic/claude-opus-5
  #   openai/gpt-5.2
  #   google/gemini-3-pro
  #   deepseek/deepseek-r2
  model: "anthropic/claude-fable-5"
  # 思考深度: low / medium / high / xhigh / max,留空则不传该参数
  # (不支持 reasoning 的模型会自动忽略)
  reasoning_effort: "high"
  # 单次请求最大 token(含思考过程,不宜过小)
  max_tokens: 32000

# ---------------- Kling 视频生成(fal.ai) ----------------
kling:
  # fal.ai 上的 Kling 文生视频模型端点,可按需替换,例如:
  #   fal-ai/kling-video/v2.5-turbo/pro/text-to-video
  #   fal-ai/kling-video/v2.1/master/text-to-video
  #   fal-ai/kling-video/v1.6/pro/text-to-video
  endpoint: "fal-ai/kling-video/v2.5-turbo/pro/text-to-video"
  # 每个镜头时长(秒),Kling 仅支持 5 或 10
  clip_duration: 10
  # 画幅比例: 16:9 / 9:16 / 1:1
  aspect_ratio: "16:9"
  # 生成失败时单个镜头的重试次数
  max_retries: 2
  # 同时生成的镜头数(并行提交,显著缩短总耗时)
  concurrency: 3

# ---------------- 成片 ----------------
video:
  # 目标总时长(秒),实际时长 = 镜头数 x 每镜头时长,就近凑齐
  target_duration: 60
  # 输出目录(相对程序目录)
  output_dir: "output"
  # 背景音乐音量(0~1)。把 mp3 等音频文件放进程序目录的 music/
  # 文件夹即可自动随机混入背景音乐;文件夹为空则输出纯净成片。
  bgm_volume: 0.22

# ---------------- ffmpeg ----------------
ffmpeg:
  # ffmpeg 可执行文件路径。已加入 PATH 时保持 "ffmpeg" 即可,
  # 否则填绝对路径,例如 C:\\tools\\ffmpeg\\bin\\ffmpeg.exe
  path: "ffmpeg"
