# AI 短视频生成器 配置文件
# 两个 API KEY、编剧模型、视频引擎与分辨率都可以直接在软件界面里填写,
# 界面会自动保存到这里;其余为进阶参数,保持默认即可。

# OpenRouter API Key(https://openrouter.ai/settings/keys)
openrouter_api_key: ""
# fal.ai API Key(https://fal.ai/dashboard/keys),所有视频引擎均经 fal.ai 生成
fal_api_key: ""

# 编剧 + 导演模型(经 OpenRouter,可填任意模型 ID)
llm:
  model: "z-ai/glm-5.3"
  # 思考深度:low / medium / high / xhigh / max,留空不传
  reasoning_effort: "medium"
  max_tokens: 32000

# Gemini Omni Flash 1.1(默认引擎):单组 3~10 秒,音频始终开启;
# 仅 16:9 / 9:16 原生,其余画幅按相邻画幅生成后居中裁剪
gemini:
  text_endpoint: "google/gemini-omni-flash/v1.1/text-to-video"
  reference_endpoint: "google/gemini-omni-flash/v1.1/reference-to-video"
  # 360p / 720p / 1080p / 4k
  resolution: "720p"
  # 费用预估单价(美元/秒),0 为不显示
  price_per_second: 0.10

# Seedance 2.5:单组最长 30 秒,参考图最多 30 张
seedance25:
  text_endpoint: "bytedance/seedance-2.5/text-to-video"
  reference_endpoint: "bytedance/seedance-2.5/reference-to-video"
  # 480p / 720p / 1080p
  resolution: "720p"
  # 随机种子,-1 为每次随机(仅带参考图的镜头组生效)
  seed: -1
  price_per_second: 0.473

# Seedance 2.0:单组最长 15 秒
seedance:
  text_endpoint: "bytedance/seedance-2.0/text-to-video"
  reference_endpoint: "bytedance/seedance-2.0/reference-to-video"
  # 480p / 720p / 1080p / 4k
  resolution: "720p"
  price_per_second: 0.3034

# Kling 3:3:4 / 4:3 画幅按相邻画幅生成后居中裁剪
kling:
  text_endpoint: "fal-ai/kling-video/v3/pro/text-to-video"
  reference_endpoint: "fal-ai/kling-video/o3/pro/reference-to-video"
  # 开启原生音效的单价;关闭音效约 0.112
  price_per_second: 0.168

# 主角参考图的文生图模型(fal.ai)
image:
  endpoint: "fal-ai/nano-banana-2"

# 旁白解说(Edge TTS,免费)
narration:
  # 由导演模型判断影片是否需要旁白
  enabled: true
  # 常用中文音色:zh-CN-XiaoxiaoNeural(女)/ zh-CN-YunxiNeural(男)
  voice: "zh-CN-XiaoxiaoNeural"
  volume: 1.0
  # 字幕默认开关(界面勾选优先)
  subtitles: true

# 成片与生成参数
video:
  # 视频引擎:gemini / seedance25 / seedance / kling(界面选择优先)
  engine: "gemini"
  # 默认画幅:16:9 / 9:16 / 1:1 / 4:3 / 3:4(界面选择优先)
  aspect_ratio: "16:9"
  # 角色台词的默认语言(用户创意明确要求其他语言时除外)
  dialogue_language: "中文普通话"
  # 原生音效与台词配音(Gemini 始终开启;Kling 关闭可省约 1/3 费用)
  generate_audio: true
  # 模型未给出分镜时长时的回退值(秒),3~15
  clip_duration: 10
  max_retries: 2
  # 同时生成的镜头数
  concurrency: 3
  # 单个镜头的生成超时(秒)
  shot_timeout: 1500
  # 默认目标总时长(秒),10~600(界面选择优先)
  target_duration: 60
  output_dir: "output"
  # 镜头间交叉溶解时长(秒),0 为硬切
  transition: 0.5
  # 背景音乐音量(0~1);把音频文件放进 music/ 文件夹即自动混入
  bgm_volume: 0.22

ffmpeg:
  # 打包版已内置;源码运行时已加入 PATH 保持 "ffmpeg",否则填绝对路径
  path: "ffmpeg"
